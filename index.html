<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascent – fitness tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E8EBF1; --surface:#F3F5F9; --raised:#FFFFFF; --ink:#141A2B; --muted:#586178; --line:#CBD1DD;
  --accent:#2A4FE0; --accent-ink:#FFFFFF; --danger:#C42B3B; --good:#12875A;
  --body:#D3D8E3; --untrained:#DCE0E9;
  --mythic:linear-gradient(120deg,#FFC83D,#FF4D8D 52%,#35D6FF);
  --display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif-condensed,Impact,sans-serif;
  --text:Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D111F; --surface:#141A2D; --raised:#1B2239; --ink:#E8EBF5; --muted:#99A2BA; --line:#283150;
    --accent:#8196FF; --accent-ink:#0D111F; --danger:#FF7B88; --good:#4FD39B;
    --body:#232B47; --untrained:#2E3757;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D111F; --surface:#141A2D; --raised:#1B2239; --ink:#E8EBF5; --muted:#99A2BA; --line:#283150;
  --accent:#8196FF; --accent-ink:#0D111F; --danger:#FF7B88; --good:#4FD39B;
  --body:#232B47; --untrained:#2E3757;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--text);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}

/* shell */
.top{display:flex;align-items:center;gap:16px;max-width:1040px;margin:0 auto;padding:14px 16px 6px}
.brand{font:900 30px/1 var(--display);letter-spacing:.01em;flex:0 0 auto}
.spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-weight:600}
.iconbtn svg{width:18px;height:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--raised);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:10px 16px 110px}
@media (min-width:820px){
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:0;margin-left:12px}
  .tab{flex-direction:row;gap:8px;padding:8px 16px;border-radius:999px;font-size:15px}
  .tab svg{width:20px;height:20px}
  .tab.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
  main{padding-bottom:60px}
}

/* generic */
.panel{background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel + .panel{margin-top:16px}
h2{font:800 26px/1.1 var(--display);letter-spacing:.01em;margin-bottom:12px}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;gap:16px}
.grid2 > .panel + .panel{margin-top:0}
@media (min-width:820px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input[type=number],input[type=text],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;font-weight:500}
textarea{min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 120px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 11px;border-radius:999px;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}

/* steps */
.ring-wrap{position:relative;width:min(260px,70vw);margin:4px auto 16px}
.ring{width:100%;display:block}
.ring .track{fill:none;stroke:var(--surface);stroke-width:16}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big-num{font:900 64px/1 var(--display);font-variant-numeric:tabular-nums}
.ring-sub{font-size:13px;color:var(--muted);margin-top:4px;max-width:150px}
.status{font-size:14px;color:var(--muted);min-height:22px;margin:10px 0 8px;text-align:center}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line)}
.facts div{padding:14px 8px 0;text-align:center}
.facts div + div{border-left:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{font:800 24px/1.2 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:8px}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.week text{fill:var(--muted);font-size:11px}
.week .goalline{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}

/* train */
.sess-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sess-head h2{margin:0}
.ex{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--surface)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.sets{margin-top:10px;display:grid;gap:8px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 40px;gap:8px;align-items:center}
.setrow.head{font-size:12px;color:var(--muted);font-weight:600}
.setrow .n{font:800 18px var(--display);color:var(--muted);text-align:center}
.setrow input{min-height:42px;text-align:center;font-weight:700;font-size:17px;background:var(--raised)}
.xbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--muted);font-size:18px;line-height:1}
.hist{margin-top:14px;display:grid;gap:10px}
.wk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.wk summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
.wk summary::-webkit-details-marker{display:none}
.wk .t{font-weight:700}
.wk table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.wk td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.wk td:last-child{text-align:right;color:var(--muted)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--raised);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(8,11,22,.6)}
.dlg-in{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 34px);overflow:auto}
.dlg-head{display:flex;justify-content:space-between;align-items:center}
.dlg-head h2{margin:0}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:grid;gap:6px;max-height:44dvh;overflow:auto}
.pick{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.pick strong{font-weight:700}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.mchip[data-s="1"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mchip[data-s="2"]{background:var(--surface);border:2px solid var(--accent);color:var(--accent)}

/* weight */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-bottom:6px}
.stat{padding:10px 4px}
.stat dt{font-size:13px;color:var(--muted)}
.stat dd{font:800 30px/1.15 var(--display);font-variant-numeric:tabular-nums}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}.stat + .stat{border-left:1px solid var(--line);padding-left:14px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.wchart text{fill:var(--muted);font-size:11px}
.wlist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

/* ranks */
.rank-layout{display:grid;gap:16px}
@media (min-width:900px){.rank-layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.maps{position:sticky;top:12px}}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.maps figure{margin:0;text-align:center}
.maps figcaption{font-size:13px;color:var(--muted);margin-top:2px}
svg.body{width:100%;max-height:560px;display:block}
.mus{outline:none}
.mus path{stroke:var(--bg);stroke-width:1;cursor:pointer;transition:filter .15s}
.mus:hover path{filter:brightness(1.15)}
.mus.sel path{stroke:var(--ink);stroke-width:2}
.mus:focus-visible path{stroke:var(--accent);stroke-width:2.5}
@media (prefers-reduced-motion:no-preference){
  .mus.mythic path{animation:glow 2.8s ease-in-out infinite}
}
@keyframes glow{50%{filter:drop-shadow(0 0 4px #FF4D8D) brightness(1.15)}}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.detail-name{font:900 38px/1 var(--display)}
.detail-xp{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;margin:8px 0}
.mlist li{display:grid;grid-template-columns:minmax(90px,1.1fr) 1.2fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none}
.mlist li.sel{background:var(--surface);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.mlist li .xp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:10px}
.ladder div{display:flex;align-items:center;gap:8px;font-size:13px}
.ladder i{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.overall{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (min-width:820px){.toast{bottom:24px}}
.rankup{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rankup b{font:800 22px var(--display)}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Ascent</h1>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-v="steps"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span>Steps</span></button>
    <button class="tab" data-v="train"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>Train</span></button>
    <button class="tab" data-v="ranks"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M5 9h14M8 9l-1 6M16 9l1 6M9 21l1-8h4l1 8"/></svg><span>Ranks</span></button>
    <button class="tab" data-v="weight"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 10a5 5 0 0 1 8 0"/><path d="M12 10l2-2.5"/></svg><span>Weight</span></button>
  </nav>
  <span class="spacer"></span>
  <button class="iconbtn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></button>
</header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=(k,o)=>parseKey(k).toLocaleDateString(undefined,o||{weekday:'short',day:'numeric',month:'short'});
const rnd=(n,dp=1)=>{const f=Math.pow(10,dp);return Math.round(n*f)/f};
const num=n=>Math.round(n).toLocaleString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const KEY='ascent.v1';
let storageOk=true;
const defaults=()=>({settings:{unit:'kg',stepGoal:10000,strideCm:72,heightCm:0,goalKg:0,sens:'med',theme:'auto',wake:false},steps:{},weights:[],workouts:[],custom:[],active:null});
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw);const d=defaults();return Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});}
  }catch(e){storageOk=false}
  return defaults();
}
let S=load();
let saveTimer=null;
function save(now){
  clearTimeout(saveTimer);
  const fn=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false}};
  if(now)fn();else saveTimer=setTimeout(fn,400);
}
window.addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});

const KG_LB=2.20462;
const U=()=>S.settings.unit;
const toDisp=kg=>U()==='kg'?kg:kg*KG_LB;
const fromDisp=v=>U()==='kg'?v:v/KG_LB;

/* ---------- muscles & ranks ---------- */
const MUSCLES=[
  {id:'chest',name:'Chest'},{id:'shoulders',name:'Shoulders'},{id:'rear',name:'Rear delts'},
  {id:'biceps',name:'Biceps'},{id:'triceps',name:'Triceps'},{id:'forearms',name:'Forearms'},
  {id:'traps',name:'Traps'},{id:'upper',name:'Upper back'},{id:'lats',name:'Lats'},{id:'lower',name:'Lower back'},
  {id:'abs',name:'Abs'},{id:'obliques',name:'Obliques'},
  {id:'glutes',name:'Glutes'},{id:'quads',name:'Quads'},{id:'adductors',name:'Adductors'},{id:'hams',name:'Hamstrings'},{id:'calves',name:'Calves'}
];
const MNAME=Object.fromEntries(MUSCLES.map(m=>[m.id,m.name]));
const MK={c:'chest',s:'shoulders',r:'rear',b:'biceps',t:'triceps',f:'forearms',tr:'traps',ub:'upper',l:'lats',lb:'lower',a:'abs',o:'obliques',g:'glutes',q:'quads',ad:'adductors',h:'hams',ca:'calves'};
const GROUPS={Chest:['chest'],Shoulders:['shoulders','rear'],Back:['traps','upper','lats','lower'],Arms:['biceps','triceps','forearms'],Core:['abs','obliques'],Legs:['quads','glutes','hams','adductors','calves']};
const groupOf=m=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(m));

const RANKS=[
  ['Rookie','#6F7788'],['Novice','#9A8467'],['Beginner','#B5763F'],['Apprentice','#D0702A'],
  ['Trainee','#7F90AA'],['Regular','#AEB6C6'],['Adept','#D4A82F'],['Skilled','#F0C53D'],
  ['Veteran','#8CC152'],['Expert','#2FB58A'],['Elite','#22A7C8'],['Master','#3A7BF2'],
  ['Grandmaster','#5B63F0'],['Champion','#8A5CF0'],['Titan','#B94BE0'],['Legend','#F0467F'],['Mythic','#FFB020']
];
const MAXR=RANKS.length-1;
const thr=i=>i<=0?0:Math.round(100*Math.pow(i,2.1));
function rankInfo(xp){
  let i=0;while(i<MAXR&&xp>=thr(i+1))i++;
  const lo=thr(i),hi=i<MAXR?thr(i+1):lo;
  return {i,name:RANKS[i][0],color:RANKS[i][1],lo,hi,p:i>=MAXR?1:(xp-lo)/(hi-lo),xp};
}
const rankBg=i=>i===MAXR?'var(--mythic)':RANKS[i][1];
function inkFor(hex){
  const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)>150?'#111':'#fff';
}
const badge=i=>`<span class="badge" style="background:${rankBg(i)};color:${i===MAXR?'#111':inkFor(RANKS[i][1])}">${RANKS[i][0]}</span>`;

/* ---------- exercise library ---------- */
const EQUIP={bb:'Barbell',db:'Dumbbell',mc:'Machine',cb:'Cable',sm:'Smith machine',bw:'Bodyweight',kb:'Kettlebell',ez:'EZ-bar',bd:'Band',ot:'Other'};
const LIB=`
Barbell Bench Press|bb|c1 t.5 s.4
Incline Barbell Bench Press|bb|c1 s.6 t.4
Decline Barbell Bench Press|bb|c1 t.5 s.2
Wide-Grip Bench Press|bb|c1 s.4 t.3
Close-Grip Bench Press|bb|t1 c.6 s.3
Barbell Floor Press|bb|c.8 t.8 s.3
Dumbbell Bench Press|db|c1 t.5 s.4
Incline Dumbbell Press|db|c1 s.6 t.4
Decline Dumbbell Press|db|c1 t.5 s.2
Neutral-Grip Dumbbell Press|db|c1 t.6 s.4
Dumbbell Floor Press|db|c.8 t.8 s.3
Dumbbell Fly|db|c1 s.3
Incline Dumbbell Fly|db|c1 s.4
Dumbbell Pullover|db|c.8 l.7 t.3
Seated Chest Press (Machine)|mc|c1 t.5 s.4
Incline Chest Press (Machine)|mc|c1 s.6 t.4
Decline Chest Press (Machine)|mc|c1 t.5
Pec Deck Fly (Machine)|mc|c1 s.3
Cable Crossover (High to Low)|cb|c1 s.3
Cable Crossover (Low to High)|cb|c1 s.5
Cable Fly (Mid Height)|cb|c1 s.3
Single-Arm Cable Press|cb|c1 t.4 s.4 o.3
Smith Machine Bench Press|sm|c1 t.5 s.4
Smith Machine Incline Press|sm|c1 s.6 t.4
Push-Up|bw|c1 t.5 s.4 a.2
Incline Push-Up|bw|c1 t.5 s.4
Decline Push-Up|bw|c1 s.6 t.5

const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function decorate(e){
  let best=null,bw=-1;
  for(const k in e.m){if(e.m[k]>bw){bw=e.m[k];best=k}}
  e.group=groupOf(best)||'Other';
  return e;
}
const LIBX=LIB.trim().split('\n').map(line=>{
  const [name,equip,ms,flag]=line.split('|');

  ms.trim().split(/\s+/).forEach(tok=>{const r=/^([a-z]+)(\d*\.?\d+)$/.exec(tok);if(r&&MK[r[1]])m[MK[r[1]]]=parseFloat(r[2])});
  return decorate({id:slug(name),name,equip,m,time:flag==='t',custom:false});
});
let EXMAP=null;
const allEx=()=>LIBX.concat(S.custom.map(c=>decorate(Object.assign({custom:true},c))));
const ex=id=>{if(!EXMAP)EXMAP=new Map(allEx().map(e=>[e.id,e]));return EXMAP.get(id)};

/* ---------- XP ---------- */
const sortedWeights=()=>S.weights.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function bodyKg(ws,d){
  let kg=null;for(const w of ws){if(w.d<=d)kg=w.kg}
  return kg!=null?kg:(ws.length?ws[0].kg:70);
}
function setPts(e,s,bw){
  const w=+s.w||0,r=+s.r||0;
  if(r<=0)return 0;
  if(e.time)return Math.max(4,r*0.35*(1+w/bw));
  let load;
  if(/assisted/i.test(e.name))load=Math.max(bw*0.7-w,5);
  else if(e.equip==='bw')load=bw*0.7+w;
  else load=w;
  if(load<=0)load=2;
  return Math.max(4,Math.sqrt(load*Math.min(r,30)));
}
function xpOf(list){
  const xp={};MUSCLES.forEach(m=>xp[m.id]=0);
  const ws=sortedWeights();
  for(const w of list){
    const bw=bodyKg(ws,w.d);
    for(const en of w.entries){
      const e=ex(en.ex);if(!e)continue;
      for(const s of en.sets){
        const p=setPts(e,s,bw);if(!p)continue;
        for(const k in e.m)xp[k]+=p*e.m[k];
      }
    }
  }
  return xp;
}
const lastLogged=exId=>{
  for(let i=S.workouts.length-1;i>=0;i--){
    const en=S.workouts[i].entries.find(x=>x.ex===exId);
    if(en)return {d:S.workouts[i].d,sets:en.sets};
  }
  return null;
};
const sortedWorkouts=()=>S.workouts.slice().sort((a,b)=>a.d===b.d?(a.id<b.id?-1:1):(a.d<b.d?-1:1));

const THR={low:1.7,med:1.2,high:0.8};
const T={on:false,g:9.81,f:0,above:false,last:0,pend:0,confirmed:false,seen:false,stamps:[],msg:'',wake:null,timer:null};
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null)return;
  T.seen=true;
  const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  T.g+=(mag-T.g)*0.02;
  T.f=T.f*0.6+(mag-T.g)*0.4;
  const t=THR[S.settings.sens]||1.2,now=Date.now();
  if(!T.above&&T.f>t){
    T.above=true;
    const dt=now-T.last;
    if(dt>280){
      if(dt>1500){T.pend=0;T.confirmed=false}
      T.last=now;
      if(T.confirmed)addSteps(1);
      else{T.pend++;if(T.pend>=4){T.confirmed=true;addSteps(4)}}
    }
  }else if(T.above&&T.f<t*0.3)T.above=false;
}
function addSteps(n){
  const k=todayKey();
  S.steps[k]=(S.steps[k]||0)+n;
  const now=Date.now();for(let i=0;i<n;i++)T.stamps.push(now);
  save();updateStepsUI();
}
async function getWake(){
  try{
    if(S.settings.wake&&'wakeLock' in navigator&&T.on&&!T.wake){
      T.wake=await navigator.wakeLock.request('screen');
      T.wake.addEventListener('release',()=>{T.wake=null});
    }
  }catch(e){T.wake=null}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.on)getWake()});
async function startTracking(){
  if(typeof DeviceMotionEvent==='undefined'){T.msg='This device or browser has no motion sensor. Add steps by hand below.';updateStepsUI();return}
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){T.msg='Motion access was denied. Allow it in your browser settings, or add steps by hand.';updateStepsUI();return}
    }
  }catch(e){T.msg='Could not ask for motion access. Add steps by hand below.';updateStepsUI();return}
  T.on=true;T.seen=false;T.pend=0;T.confirmed=false;T.msg='';
  window.addEventListener('devicemotion',onMotion);
  getWake();
  clearTimeout(T.timer);
  T.timer=setTimeout(()=>{
    if(T.on&&!T.seen){stopTracking();T.msg='No motion data arrived. Open this page on your phone, or add steps by hand.';updateStepsUI()}
  },3500);
  updateStepsUI();
}
function stopTracking(){
  T.on=false;
  window.removeEventListener('devicemotion',onMotion);
  clearTimeout(T.timer);
  try{if(T.wake)T.wake.release()}catch(e){}
  T.wake=null;
  save(true);updateStepsUI();
}
setInterval(()=>{if(T.on)updateStepsUI()},2000);

const latestKg=()=>{const ws=sortedWeights();return ws.length?ws[ws.length-1].kg:70};
const RING=2*Math.PI*96;
function updateStepsUI(){
  const n=S.steps[todayKey()]||0,goal=S.settings.stepGoal||10000;
  const set=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v};
  set('stepNum',num(n));set('goalTxt',num(goal));
  const ring=document.getElementById('ringP');
  if(ring)ring.setAttribute('stroke-dashoffset',String(RING*(1-Math.min(1,n/goal))));
  const km=n*(S.settings.strideCm||72)/100000;
  set('stDist',U()==='kg'?rnd(km,2)+' km':rnd(km*0.621371,2)+' mi');
  set('stKcal',num(n*latestKg()*0.0006));
  const now=Date.now();T.stamps=T.stamps.filter(t=>now-t<10000);
  set('stCad',T.on?String(T.stamps.length*6):'0');
  const st=document.getElementById('trackStatus');
  if(st){
    if(T.msg)st.textContent=T.msg;
    else if(T.on)st.innerHTML='<span class="live"></span>Counting. Keep this page open and the screen on.';
    else st.textContent='Not counting. Tap start and carry your phone while you walk.';
  }
  const btn=document.getElementById('trackBtn');
  if(btn){btn.textContent=T.on?'Stop counting':'Start counting';btn.classList.toggle('primary',!T.on)}
  const wc=document.getElementById('weekChart');
  if(wc)wc.innerHTML=weekChart();
}
function weekChart(){
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=keyOf(d);days.push({k,v:S.steps[k]||0,l:d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3)})}
  const goal=S.settings.stepGoal||10000,mx=Math.max(goal,...days.map(d=>d.v))*1.12;
  const H=120,W=320,bw=30,gap=(W-7*bw)/7;
  let s=`<svg class="week" viewBox="0 0 ${W} ${H+34}" role="img" aria-label="Steps over the last 7 days">`;
  const gy=H-(goal/mx)*H;
  s+=`<line class="goalline" x1="0" x2="${W}" y1="${gy}" y2="${gy}"/>`;
  days.forEach((d,i)=>{
    const h=Math.max(d.v?3:0,(d.v/mx)*H),x=gap/2+i*(bw+gap),y=H-h,today=i===6;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="${d.v>=goal?'var(--good)':'var(--accent)'}" opacity="${today?1:.55}"><title>${esc(fmtDate(d.k))}: ${num(d.v)} steps</title></rect>`;
    if(d.v)s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="font-size:9px">${d.v>=1000?rnd(d.v/1000,1)+'k':d.v}</text>`;
    s+=`<text x="${x+bw/2}" y="${H+16}" text-anchor="middle" ${today?'style="font-weight:700;fill:var(--ink)"':''}>${d.l}</text>`;
  });
  return s+'</svg>';
}

function weightChart(ws){
  let list=ws;
  if(wRange!=='all'){const c=new Date();c.setDate(c.getDate()-(+wRange));const ck=keyOf(c);list=ws.filter(w=>w.d>=ck)}
  if(list.length<2)return '<p class="empty">Log at least two weigh-ins in this range to see the trend.</p>';
  const W=600,H=230,L=44,R=14,Tp=14,B=28;
  const vals=list.map(w=>toDisp(w.kg));
  const gv=S.settings.goalKg?toDisp(S.settings.goalKg):null;
  let lo=Math.min(...vals,gv==null?Infinity:gv),hi=Math.max(...vals,gv==null?-Infinity:gv);
  const padv=Math.max((hi-lo)*0.15,0.5);lo-=padv;hi+=padv;
  const t0=parseKey(list[0].d).getTime(),t1=parseKey(list[list.length-1].d).getTime(),span=Math.max(t1-t0,1);
  const X=d=>L+((parseKey(d).getTime()-t0)/span)*(W-L-R);
  const Y=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B);
  const pts=list.map(w=>[X(w.d),Y(toDisp(w.kg))]);
  let s=`<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time">`;
  for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${rnd(v)}</text>`}
  if(gv!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(gv)}" y2="${Y(gv)}" stroke="var(--good)" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(gv)-5}" text-anchor="end" style="fill:var(--good)">goal</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  s+=`<path d="${line}L${pts[pts.length-1][0].toFixed(1)},${H-B}L${pts[0][0].toFixed(1)},${H-B}Z" fill="var(--accent)" opacity=".12"/>`;
  s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(list.length<=60)pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--raised)" stroke="var(--accent)" stroke-width="2"><title>${esc(fmtDate(list[i].d))}: ${rnd(toDisp(list[i].kg))} ${U()}</title></circle>`});
  s+=`<text x="${L}" y="${H-8}">${esc(fmtDate(list[0].d,{day:'numeric',month:'short'}))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(fmtDate(list[list.length-1].d,{day:'numeric',month:'short'}))}</text>`;
  return s+'</svg>';
}

  $('#detail').innerHTML=`<div class="detail-top"><div class="detail-name">${esc(m)}</div>${badge(ri.i)}</div>
    <p class="detail-xp">${num(xp[sel])} XP total, ${nxt}</p>
    <div class="bar" role="progressbar" aria-valuenow="${Math.round(ri.p*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(2,Math.round(ri.p*100))}%;background:${rankBg(ri.i)}"></i></div>
    <p class="small muted" style="margin-top:12px">${xp[sel]>0?'':'No sets logged for this muscle yet. '}Good ways to train it: ${esc(sources.join(', '))}.</p>`;
  $('#mlist').innerHTML=MUSCLES.slice().sort((a,b)=>(rk[b.id].i+rk[b.id].p)-(rk[a.id].i+rk[a.id].p)).map(mu=>{const r=rk[mu.id];return `<li class="${mu.id===sel?'sel':''}" data-m="${mu.id}" tabindex="0" role="button"><span><b>${esc(mu.name)}</b></span><span style="display:flex;align-items:center;gap:8px">${badge(r.i)}</span><span class="xp">${num(xp[mu.id])} XP</span></li>`}).join('');
}
function pickMuscle(id){
  if(!MNAME[id])return;
  sel=id;renderRanks();
}

/* ---------- settings ---------- */
function openSettings(){
  const s=S.settings;
  openDlg(`<div class="dlg-in">
    <div class="dlg-head"><h2>Settings</h2><button class="xbtn" data-dlg="close" aria-label="Close">&times;</button></div>
    <div class="row">
      <label class="field">Weight unit<select data-s="unit"><option value="kg" ${s.unit==='kg'?'selected':''}>Kilograms (kg)</option><option value="lb" ${s.unit==='lb'?'selected':''}>Pounds (lb)</option></select></label>
      <label class="field">Theme<select data-s="theme"><option value="auto" ${s.theme==='auto'?'selected':''}>Match device</option><option value="light" ${s.theme==='light'?'selected':''}>Light</option><option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option></select></label>
    </div>
    <div class="row">
      <label class="field">Daily step goal<input type="number" inputmode="numeric" min="500" step="500" data-s="stepGoal" value="${s.stepGoal}"></label>
      <label class="field">Stride length (cm)<input type="number" inputmode="numeric" min="30" max="150" data-s="strideCm" value="${s.strideCm}"></label>
    </div>
    <div class="row">
      <label class="field">Height (cm)<input type="number" inputmode="numeric" min="0" data-s="heightCm" value="${s.heightCm||''}" placeholder="Optional"></label>
      <label class="field">Goal weight (${s.unit})<input type="number" inputmode="decimal" step="0.1" min="0" data-s="goalKg" value="${s.goalKg?rnd(toDisp(s.goalKg)):''}" placeholder="Optional"></label>
    </div>
    <label class="field">Step sensitivity<select data-s="sens"><option value="low" ${s.sens==='low'?'selected':''}>Low (fewer false steps)</option><option value="med" ${s.sens==='med'?'selected':''}>Normal</option><option value="high" ${s.sens==='high'?'selected':''}>High (gentle walking)</option></select></label>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <h3>Backup</h3>
    <p class="small muted">Your data is stored in this browser only. Copy the backup text to move it to another device or keep a safe copy.</p>
    <textarea id="bk" readonly aria-label="Backup data">${esc(JSON.stringify(S))}</textarea>
    <div class="row"><button class="btn" data-set="copy">Copy backup</button></div>
    <textarea id="rs" placeholder="Paste a backup here to restore it" aria-label="Restore data"></textarea>
    <div class="row"><button class="btn" data-set="restore">Restore from backup</button><button class="btn danger" data-set="reset">Erase everything</button></div>
  </div>`);
}
dlg.addEventListener('change',e=>{
  const k=e.target.dataset.s;if(!k)return;
  const s=S.settings;let v=e.target.value;
  if(k==='unit'||k==='theme'||k==='sens')s[k]=v;
  else if(k==='goalKg'){const n=parseFloat(v);s.goalKg=n>0?rnd(fromDisp(n),2):0}
  else{const n=parseFloat(v);s[k]=n>0?n:(k==='heightCm'?0:s[k])}
  if(k==='unit'){openSettings()}
  applyTheme();save(true);render();
});
dlg.addEventListener('click',e=>{
  const b=e.target.closest('[data-set]');if(!b)return;
  const a=b.dataset.set;
  if(a==='copy'){
    const ta=$('#bk');ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Backup copied')).catch(()=>{try{document.execCommand('copy');toast('Backup copied')}catch(x){toast('Press and hold to copy the selected text')}});
  }else if(a==='restore'){
    try{
      const o=JSON.parse($('#rs').value);
      if(!o||typeof o!=='object'||!Array.isArray(o.workouts))throw 0;
      const d=defaults();S=Object.assign(d,o,{settings:Object.assign(d.settings,o.settings||{})});
      EXMAP=null;save(true);applyTheme();closeDlg();render();toast('Backup restored');
    }catch(x){toast('That backup text is not valid')}
  }else if(a==='reset'){
    if(confirm('Erase all steps, workouts, weights and ranks on this device?')){S=defaults();EXMAP=null;save(true);applyTheme();closeDlg();render();toast('All data erased')}
  }
});
function applyTheme(){
  const t=S.settings.theme;
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- routing & events ---------- */
let view='steps';
const VIEWS={steps:renderSteps,train:renderTrain,ranks:renderRanks,weight:renderWeight};
function render(){
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.v===view;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  VIEWS[view]();
}
function go(v){view=v;render();window.scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
$('#openSettings').addEventListener('click',openSettings);

$('#view').addEventListener('click',e=>{
  const mus=e.target.closest('.mus,.mlist li');
  if(mus){pickMuscle(mus.dataset.m);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j;
  switch(a){
    case 'track':T.on?stopTracking():startTracking();break;
    case 'add-steps':case 'set-steps':{
      const v=parseInt($('#manualSteps').value,10);
      if(!(v>=0)){toast('Enter a number of steps');break}
      const k=todayKey();
      S.steps[k]=a==='add-steps'?(S.steps[k]||0)+v:v;
      $('#manualSteps').value='';save(true);updateStepsUI();toast(a==='add-steps'?'Steps added':'Total updated');break}
    case 'start':S.active={d:todayKey(),entries:[]};save(true);renderTrain();openPicker();break;
    case 'pick':openPicker();break;
    case 'discard':if(confirm('Discard this workout?')){S.active=null;save(true);renderTrain()}break;
    case 'finish':finishWorkout();break;
    case 'rm-ex':S.active.entries.splice(i,1);save();renderTrain();break;
    case 'add-set':{const st=S.active.entries[i].sets;const l=st[st.length-1]||{w:0,r:0};st.push({w:l.w,r:l.r});save();renderTrain();break}
    case 'rm-set':{const en=S.active.entries[i];en.sets.splice(j,1);if(!en.sets.length)en.sets.push({w:0,r:0});save();renderTrain();break}
    case 'repeat':{
      const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)break;
      if(S.active&&S.active.entries.length&&!confirm('Replace your current workout?'))break;
      S.active={d:todayKey(),entries:w.entries.map(en=>({ex:en.ex,sets:en.sets.map(s=>({w:s.w,r:s.r}))}))};
      save(true);renderTrain();window.scrollTo(0,0);toast('Workout loaded');break}
    case 'del-workout':if(confirm('Delete this workout? Muscle ranks will update.')){S.workouts=S.workouts.filter(x=>x.id!==b.dataset.id);save(true);renderTrain()}break;
    case 'add-weight':{
      const v=parseFloat($('#wv').value),d=$('#wd').value||todayKey();
      if(!(v>0)){toast('Enter your weight');break}
      const kg=rnd(fromDisp(v),2);
      const ex1=S.weights.find(w=>w.d===d);
      if(ex1)ex1.kg=kg;else S.weights.push({d,kg});
      save(true);renderWeight();toast('Weight saved');break}
    case 'del-weight':S.weights=S.weights.filter(w=>w.d!==b.dataset.d);save(true);renderWeight();break;
    case 'range':wRange=b.dataset.v;renderWeight();break;
  }
});
$('#view').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.mus,.mlist li')){e.preventDefault();pickMuscle(e.target.dataset.m)}
});
$('#view').addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='wake'){S.settings.wake=t.checked;save();if(t.checked)getWake();else{try{if(T.wake)T.wake.release()}catch(x){}}return}
  const i=+t.dataset.i,j=+t.dataset.j;
  const s=S.active&&S.active.entries[i]&&S.active.entries[i].sets[j];if(!s)return;
  const v=parseFloat(t.value);
  if(f==='w')s.w=v>0?rnd(fromDisp(v),3):0;
  else s.r=v>0?Math.round(v):0;
  save();
});

applyTheme();
if(!storageOk){const n=document.createElement('p');n.className='small muted';n.style.cssText='max-width:1040px;margin:4px auto 0;padding:0 16px';n.textContent='This browser is blocking storage, so your data will be lost when you close the page.';$('.top').after(n)}
render();
})();
</script>
</body>
</html>
